<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Get in touch with Abi Gandhi."><title>Contact | Abi Gandhi</title><link rel="stylesheet" href="style.css"><link rel="icon" href="ag-mark.png" type="image/png"><style>.brand{display:inline-flex;align-items:center;gap:11px}.brand-mark{display:block;width:34px;height:30px;object-fit:contain;flex-shrink:0}</style></head><body class="light"><header class="masthead"><a class="brand" href="index.html" aria-label="Abi Gandhi — Home"><img class="brand-mark" src="ag-mark.png" alt="" aria-hidden="true"></a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="statement.html">Statement</a><a href="repository.html">Repository</a><a href="contact.html" aria-current="page">Contact</a></nav></header><main class="page-shell contact-page"><div class="page-label eyebrow">Correspondence</div><h1>Good questions<br>cross disciplines.</h1><p class="dek">Get in touch.</p><hr class="rule"><form id="contact-form" class="contact-form"><label for="sender-name">Your name</label><input id="sender-name" name="name" autocomplete="name" required maxlength="120"><label for="sender-email">Your email</label><input id="sender-email" name="email" type="email" autocomplete="email" required maxlength="254"><label for="subject">Subject</label><input id="subject" name="subject" required maxlength="180"><label for="message">Message</label><textarea id="message" name="message" rows="8" required maxlength="10000"></textarea><button type="submit" class="text-link">COMPOSE MESSAGE <span aria-hidden="true">→</span></button><p class="form-note">This opens your email application with a draft addressed to me. The website does not send or store your message.</p></form><footer class="page-footer">Abi Gandhi — 2026</footer></main><script>document.getElementById('contact-form').addEventListener('submit',function(e){e.preventDefault();const f=e.currentTarget;const name=f.elements.name.value.trim(),email=f.elements.email.value.trim(),subject=f.elements.subject.value.trim(),message=f.elements.message.value.trim();if(!f.reportValidity())return;const body=`From: ${name} (${email})\n\n${message}`;location.href='mailto:abigailrgandhi@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);});</script></body></html>
